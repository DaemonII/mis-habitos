<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Hábitos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mis Hábitos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0612;
    --bg2: #120d1e;
    --bg3: #1a1228;
    --purple: #7c3aed;
    --purple-light: #a855f7;
    --purple-dim: #2d1b5e;
    --green: #22c55e;
    --green-dim: #14532d;
    --red: #ef4444;
    --red-dim: #450a0a;
    --text: #f1e8ff;
    --text2: #a08cc0;
    --border: #2a1f42;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 100px;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #1a0a3a 0%, #0f0620 100%);
    padding: 52px 20px 20px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  header .date {
    font-size: 13px;
    color: var(--text2);
    margin-top: 2px;
    text-transform: capitalize;
  }

  /* UPDATE BANNER */
  #update-banner {
    display: none;
    background: var(--purple);
    color: white;
    text-align: center;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  /* NAV */
  nav {
    display: flex;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  nav button {
    flex: 1;
    padding: 14px 4px;
    background: none;
    border: none;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }

  nav button.active {
    color: var(--purple-light);
    border-bottom-color: var(--purple-light);
  }

  /* VIEWS */
  .view { display: none; padding: 20px; }
  .view.active { display: block; }

  /* TODAY VIEW */
  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 12px;
  }

  .habit-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }

  .habit-item.done {
    background: #0f1f12;
    border-color: #1a3a22;
  }

  .habit-emoji { font-size: 22px; min-width: 28px; text-align: center; }

  .habit-name {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
  }

  .habit-item.done .habit-name {
    color: var(--text2);
    text-decoration: line-through;
  }

  .habit-check {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .habit-item.done .habit-check {
    background: var(--green);
    border-color: var(--green);
  }

  .habit-item.done .habit-check::after {
    content: '✓';
    color: white;
    font-size: 14px;
    font-weight: 700;
  }

  .delete-btn {
    background: none;
    border: none;
    color: #3a2a5a;
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
    transition: color 0.2s;
  }
  .delete-btn:hover { color: var(--red); }

  /* PROGRESS BAR */
  .progress-bar-wrap {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 8px;
  }

  .progress-label span:last-child { color: var(--purple-light); font-weight: 600; }

  .progress-bar {
    height: 6px;
    background: var(--bg3);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--purple), var(--purple-light));
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* ADD HABIT */
  .add-section {
    margin-top: 24px;
  }

  .add-row {
    display: flex;
    gap: 10px;
  }

  .add-input {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .add-input:focus { border-color: var(--purple); }
  .add-input::placeholder { color: var(--text2); }

  .add-btn {
    background: var(--purple);
    border: none;
    border-radius: var(--radius);
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    font-weight: 700;
    padding: 0 18px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .add-btn:hover { background: var(--purple-light); }

  /* CALENDAR VIEW */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .cal-nav button {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 18px;
    width: 36px;
    height: 36px;
    cursor: pointer;
  }

  .cal-month {
    font-size: 16px;
    font-weight: 600;
    text-transform: capitalize;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .cal-dow {
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    color: var(--text2);
    letter-spacing: 0.5px;
    padding: 4px 0;
    text-transform: uppercase;
  }

  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    transition: all 0.15s;
  }

  .cal-day.empty { cursor: default; }
  .cal-day.today { font-weight: 700; box-shadow: 0 0 0 2px var(--purple); }

  .cal-day.all-done { background: var(--green-dim); color: var(--green); }
  .cal-day.some-done { background: #1a1a0a; color: #ca8a04; }
  .cal-day.none-done { background: var(--red-dim); color: var(--red); }
  .cal-day.future { color: var(--text2); }
  .cal-day.no-habits { color: #3a2a5a; }

  /* PROGRESO VIEW */
  .progreso-header {
    margin-bottom: 16px;
  }

  .progreso-scroll {
    overflow-x: auto;
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }

  .progreso-table {
    min-width: 100%;
    border-collapse: collapse;
  }

  .progreso-table th {
    background: var(--bg3);
    font-size: 10px;
    font-weight: 600;
    color: var(--text2);
    padding: 8px 6px;
    text-align: center;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
  }

  .progreso-table th:first-child {
    text-align: left;
    padding-left: 12px;
    min-width: 140px;
    position: sticky;
    left: 0;
    z-index: 2;
    background: var(--bg3);
  }

  .progreso-table td {
    padding: 0;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid #1a1228;
    text-align: center;
  }

  .progreso-table td:first-child {
    background: var(--bg2);
    padding: 10px 12px;
    text-align: left;
    position: sticky;
    left: 0;
    z-index: 1;
    border-right: 1px solid var(--border);
  }

  .habit-row-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
  }

  .habit-row-emoji { font-size: 16px; }

  .day-cell {
    width: 30px;
    height: 38px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .day-cell.done { background: var(--green-dim); }
  .day-cell.not-done { background: var(--red-dim); }
  .day-cell.future { background: transparent; cursor: default; }

  .day-cell.done::after { content: ''; display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin: auto; margin-top: 15px; }
  .day-cell.not-done::after { content: ''; display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin: auto; margin-top: 15px; }

  .day-cell.today-col { box-shadow: inset 0 0 0 1px var(--purple); }

  .today-marker {
    font-size: 9px;
    font-weight: 700;
    color: var(--purple-light);
  }

  /* MONTH NAV for progreso */
  .progreso-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .progreso-nav button {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    width: 34px;
    height: 34px;
    cursor: pointer;
  }

  .progreso-nav .month-label {
    font-size: 15px;
    font-weight: 600;
    text-transform: capitalize;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text2);
  }

  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

</style>
</head>
<body>

<div id="update-banner" onclick="doUpdate()">✨ Nueva versión disponible — Pulsa para actualizar</div>

<header>
  <h1>✦ Mis Hábitos</h1>
  <div class="date" id="header-date"></div>
</header>

<nav>
  <button class="active" onclick="switchView('hoy', this)">Hoy</button>
  <button onclick="switchView('progreso', this)">Progreso</button>
  <button onclick="switchView('calendario', this)">Calendario</button>
</nav>

<!-- HOY -->
<div class="view active" id="view-hoy">
  <div class="progress-bar-wrap">
    <div class="progress-label">
      <span>Progreso de hoy</span>
      <span id="prog-text">0 / 0</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="prog-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="section-title">Hábitos</div>
  <div id="habits-list"></div>

  <div class="add-section">
    <div class="section-title">Añadir hábito</div>
    <div class="add-row">
      <input class="add-input" id="new-habit" placeholder="ej: Beber agua, Meditar..." maxlength="40">
      <button class="add-btn" onclick="addHabit()">+</button>
    </div>
  </div>
</div>

<!-- PROGRESO -->
<div class="view" id="view-progreso">
  <div class="progreso-nav">
    <button onclick="changeProgresoMonth(-1)">‹</button>
    <span class="month-label" id="progreso-month-label"></span>
    <button onclick="changeProgresoMonth(1)">›</button>
  </div>
  <div class="progreso-scroll">
    <table class="progreso-table" id="progreso-table"></table>
  </div>
</div>

<!-- CALENDARIO -->
<div class="view" id="view-calendario">
  <div class="cal-nav">
    <button onclick="changeCalMonth(-1)">‹</button>
    <span class="cal-month" id="cal-month-label"></span>
    <button onclick="changeCalMonth(1)">›</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
</div>

<script>
// ── DATA ────────────────────────────────────────────────────────────────────
let habits = JSON.parse(localStorage.getItem('habits') || '[]');
let logs   = JSON.parse(localStorage.getItem('logs')   || '{}');

function save() {
  localStorage.setItem('habits', JSON.stringify(habits));
  localStorage.setItem('logs',   JSON.stringify(logs));
}

// ── EMOJI PICKER ────────────────────────────────────────────────────────────
function pickEmoji(name) {
  const n = name.toLowerCase();
  const map = [
    [['agua','beber','hidrat'],'💧'],
    [['corr','run','jog','cardio'],'🏃'],
    [['medita','mindful','respir'],'🧘'],
    [['leer','libro','lectura','read'],'📚'],
    [['creatina','proteina','suplemento','vitamina','omega','magnesio','zinc','hierro','calcio'],'💊'],
    [['gym','ejercicio','peso','muscu','entren','fitnes'],'🏋️'],
    [['yoga'],'🤸'],
    [['dormir','sueño','descanso'],'😴'],
    [['fruta','verdura','ensalada','vegetal','comer'],'🥗'],
    [['café','coffee','desayuno'],'☕'],
    [['caminar','paseo','andar','walk'],'🚶'],
    [['bici','ciclismo'],'🚴'],
    [['natacion','nadar','piscina'],'🏊'],
    [['escribir','diario','journal'],'✍️'],
    [['alcohol','vino','cerveza','copa'],'🍷'],
    [['fumar','tabaco','cigarro'],'🚭'],
    [['piano','guitarra','musica','instrumento'],'🎵'],
    [['ingles','idioma','frances','aleman'],'🗣️'],
    [['estudio','estudiar','curso'],'📖'],
    [['sol','exterior','aire'],'☀️'],
    [['ducha','baño'],'🚿'],
    [['orden','limpieza'],'🧹'],
    [['trabajo','productiv'],'💼'],
    [['foto','fotografia'],'📷'],
    [['dinero','ahorro','budget','finanz'],'💰'],
    [['rezar','orar','fe'],'🙏'],
    [['mascotas','perro','gato','walk'],'🐕'],
    [['podcast','audio'],'🎧'],
    [['serie','pelicula','tele'],'📺'],
    [['cocinar','receta'],'🍳'],
  ];
  for (const [keys, emoji] of map) {
    if (keys.some(k => n.includes(k))) return emoji;
  }
  return '⭐';
}

// ── DATE UTILS ───────────────────────────────────────────────────────────────
function todayKey() {
  return new Date().toISOString().slice(0, 10);
}

function dateKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

// ── HEADER DATE ──────────────────────────────────────────────────────────────
function renderHeaderDate() {
  const d = new Date();
  document.getElementById('header-date').textContent =
    d.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
}
renderHeaderDate();

// ── SWITCH VIEW ──────────────────────────────────────────────────────────────
function switchView(id, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  btn.classList.add('active');
  if (id === 'calendario') renderCal();
  if (id === 'progreso') renderProgreso();
}

// ── HOY VIEW ────────────────────────────────────────────────────────────────
function renderHoy() {
  const key = todayKey();
  const list = document.getElementById('habits-list');

  if (habits.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">🌱</div><p>Añade tu primer hábito abajo</p></div>`;
    document.getElementById('prog-text').textContent = '0 / 0';
    document.getElementById('prog-fill').style.width = '0%';
    return;
  }

  const done = habits.filter(h => logs[key]?.[h.id]).length;
  document.getElementById('prog-text').textContent = `${done} / ${habits.length}`;
  document.getElementById('prog-fill').style.width = habits.length ? `${done/habits.length*100}%` : '0%';

  list.innerHTML = habits.map(h => {
    const isDone = !!logs[key]?.[h.id];
    return `<div class="habit-item ${isDone?'done':''}" onclick="toggleHabit('${h.id}')">
      <span class="habit-emoji">${h.emoji}</span>
      <span class="habit-name">${h.name}</span>
      <div class="habit-check"></div>
      <button class="delete-btn" onclick="event.stopPropagation();deleteHabit('${h.id}')">×</button>
    </div>`;
  }).join('');
}

function toggleHabit(id) {
  const key = todayKey();
  if (!logs[key]) logs[key] = {};
  logs[key][id] = !logs[key][id];
  save();
  renderHoy();
}

function addHabit() {
  const input = document.getElementById('new-habit');
  const name = input.value.trim();
  if (!name) return;
  const id = 'h' + Date.now();
  habits.push({ id, name, emoji: pickEmoji(name) });
  save();
  input.value = '';
  renderHoy();
}

function deleteHabit(id) {
  habits = habits.filter(h => h.id !== id);
  save();
  renderHoy();
  renderProgreso();
}

document.getElementById('new-habit').addEventListener('keydown', e => {
  if (e.key === 'Enter') addHabit();
});

// ── CALENDAR VIEW ────────────────────────────────────────────────────────────
let calDate = new Date();

function changeCalMonth(dir) {
  calDate = new Date(calDate.getFullYear(), calDate.getMonth() + dir, 1);
  renderCal();
}

function renderCal() {
  const y = calDate.getFullYear(), m = calDate.getMonth();
  document.getElementById('cal-month-label').textContent =
    calDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });

  const today = new Date();
  const firstDow = (new Date(y, m, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(y, m+1, 0).getDate();

  const dows = ['L','M','X','J','V','S','D'];
  let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');

  for (let i = 0; i < firstDow; i++) html += `<div class="cal-day empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dk = dateKey(y, m, d);
    const isToday = y === today.getFullYear() && m === today.getMonth() && d === today.getDate();
    const isFuture = new Date(y, m, d) > today;

    let cls = 'cal-day';
    if (isToday) cls += ' today';

    if (!isFuture && habits.length > 0) {
      const done = habits.filter(h => logs[dk]?.[h.id]).length;
      if (done === habits.length) cls += ' all-done';
      else if (done > 0) cls += ' some-done';
      else cls += ' none-done';
    } else if (isFuture) {
      cls += ' future';
    } else {
      cls += ' no-habits';
    }

    html += `<div class="${cls}">${d}</div>`;
  }

  document.getElementById('cal-grid').innerHTML = html;
}

// ── PROGRESO VIEW ────────────────────────────────────────────────────────────
let progresoDate = new Date();

function changeProgresoMonth(dir) {
  progresoDate = new Date(progresoDate.getFullYear(), progresoDate.getMonth() + dir, 1);
  renderProgreso();
}

function renderProgreso() {
  const y = progresoDate.getFullYear(), m = progresoDate.getMonth();
  document.getElementById('progreso-month-label').textContent =
    progresoDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });

  const today = new Date();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayNum = today.getDate();
  const isCurrentMonth = y === today.getFullYear() && m === today.getMonth();

  if (habits.length === 0) {
    document.getElementById('progreso-table').innerHTML =
      `<tr><td colspan="32"><div class="empty-state"><div class="icon">📊</div><p>Añade hábitos para ver tu progreso</p></div></td></tr>`;
    return;
  }

  // Header row
  let header = '<thead><tr><th>Hábito</th>';
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = isCurrentMonth && d === todayNum;
    header += `<th>${isToday ? '<div class="today-marker">HOY</div>' : ''}${d}</th>`;
  }
  header += '</tr></thead>';

  // Body rows
  let body = '<tbody>';
  for (const h of habits) {
    body += `<tr><td><div class="habit-row-name"><span class="habit-row-emoji">${h.emoji}</span>${h.name}</div></td>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dk = dateKey(y, m, d);
      const cellDate = new Date(y, m, d);
      const isFuture = cellDate > today;
      const isToday = isCurrentMonth && d === todayNum;

      let cls = 'day-cell';
      if (isToday) cls += ' today-col';

      if (!isFuture) {
        cls += logs[dk]?.[h.id] ? ' done' : ' not-done';
      } else {
        cls += ' future';
      }

      body += `<td><div class="${cls}" onclick="toggleDayHabit('${h.id}','${dk}')"></div></td>`;
    }
    body += '</tr>';
  }
  body += '</tbody>';

  document.getElementById('progreso-table').innerHTML = header + body;
}

function toggleDayHabit(hid, dk) {
  const d = new Date(dk);
  const today = new Date();
  today.setHours(23,59,59);
  if (d > today) return;
  if (!logs[dk]) logs[dk] = {};
  logs[dk][hid] = !logs[dk][hid];
  save();
  renderProgreso();
  if (dk === todayKey()) renderHoy();
}

// ── PWA UPDATE ───────────────────────────────────────────────────────────────
function doUpdate() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
      location.reload(true);
    });
  } else {
    location.reload(true);
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          document.getElementById('update-banner').style.display = 'block';
        }
      });
    });
  });
}
