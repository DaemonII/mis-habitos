<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Hábitos">
<meta name="theme-color" content="#26215C">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Mis Hábitos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0f0720;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#EEEDFE}
#app{min-height:100vh;padding:env(safe-area-inset-top,20px) 0 env(safe-area-inset-bottom,20px)}
.wrap{max-width:420px;margin:0 auto;padding:24px 16px 48px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.htitle{font-size:26px;font-weight:600;color:#EEEDFE;letter-spacing:-0.5px}
.hsub{font-size:12px;color:#7F77DD;margin-top:4px;text-transform:capitalize}
.ring-w{position:relative;display:flex;align-items:center;justify-content:center}
.ring-txt{position:absolute;font-size:11px;font-weight:600;color:#AFA9EC}
.tabs{display:flex;gap:5px;background:#1a1248;padding:4px;border-radius:14px;margin-bottom:20px}
.tab{flex:1;padding:9px;border:none;border-radius:10px;background:transparent;color:#7F77DD;cursor:pointer;font-size:14px;font-weight:500;font-family:inherit;transition:all .2s}
.tab.on{background:#3C3489;color:#CECBF6}
.hlist{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.empty{text-align:center;color:#534AB7;font-size:14px;padding:28px 0}
.hcard{display:flex;align-items:center;gap:12px;padding:14px 15px;background:#1a1248;border-radius:14px;border:1px solid #2d2572;cursor:pointer;transition:all .25s;user-select:none}
.hcard:active{transform:scale(.98)}
.hcard.done{background:#251d6b;border-color:#534AB7}
.chk{width:23px;height:23px;border-radius:7px;border:1.5px solid #534AB7;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:13px;color:transparent}
.chk.on{background:#7F77DD;border-color:#7F77DD;color:white}
.hico{width:30px;height:30px;background:#2d2572;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.hname{flex:1;font-size:15px;color:#CECBF6;pointer-events:none}
.hname.s{color:#534AB7;text-decoration:line-through}
.delbtn{background:transparent;border:none;color:#3C3489;cursor:pointer;font-size:21px;line-height:1;padding:4px 6px;font-family:inherit;transition:color .2s}
.delbtn:active{color:#AFA9EC}
.addrow{display:flex;gap:8px}
.ainput{flex:1;padding:12px 14px;background:#1a1248;border:1px solid #2d2572;border-radius:13px;color:#EEEDFE;font-size:15px;font-family:inherit;outline:none;transition:border .2s}
.ainput::placeholder{color:#534AB7}
.ainput:focus{border-color:#7F77DD}
.abtn{width:46px;height:46px;background:#7F77DD;border:none;border-radius:13px;color:white;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:background .2s;flex-shrink:0}
.abtn:active{background:#534AB7}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.navb{background:#1a1248;border:1px solid #2d2572;border-radius:9px;color:#AFA9EC;width:36px;height:36px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.navb:active{background:#2d2572}
.mname{color:#CECBF6;font-size:15px;font-weight:500;text-transform:capitalize}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
.clbl{text-align:center;color:#534AB7;font-size:11px;font-weight:500;padding:3px 0}
.cday{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid transparent;transition:all .15s}
.cday.tap{cursor:pointer}
.cday.tap:active{opacity:.7}
.cnum{font-size:11px}
.csub{font-size:8px;color:#AFA9EC;margin-top:1px}
.leg{display:flex;gap:14px;justify-content:center;margin-bottom:18px}
.legitem{display:flex;align-items:center;gap:5px;color:#7F77DD;font-size:11px}
.ldot{width:10px;height:10px;border-radius:3px}
.detail{background:#1a1248;border-radius:14px;padding:14px;border:1px solid #2d2572;margin-top:4px}
.dtitle{color:#CECBF6;font-size:14px;font-weight:500;margin-bottom:10px;text-transform:capitalize}
.drow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #2d2572}
.drow:last-child{border-bottom:none}
.dchk{width:20px;height:20px;border-radius:6px;border:1.5px solid #534AB7;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;flex-shrink:0}
.dchk.on{background:#7F77DD;border-color:#7F77DD;color:white}
.dico{width:24px;height:24px;background:#2d2572;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.dname{font-size:14px;color:#CECBF6}
.dname.s{color:#534AB7;text-decoration:line-through}
</style>
</head>
<body>
<div id="app"></div>
<script>
var habits=[],logs={},view='today',curMon=new Date(),selDay=null;
var HK='mis-habitos-v1',LK='mis-habitos-logs-v1';
var def=[{id:'h1',name:'Beber agua',ic:'💧'},{id:'h2',name:'Meditar',ic:'🧘'}];

function td(){return new Date().toISOString().split('T')[0]}
function fmt(d){return d.toISOString().split('T')[0]}

function load(){
  try{
    var h=localStorage.getItem(HK);
    var l=localStorage.getItem(LK);
    habits=h?JSON.parse(h):def.map(function(x){return Object.assign({},x);});
    logs=l?JSON.parse(l):{};
  }catch(e){habits=def.map(function(x){return Object.assign({},x);});logs={};}
  render();
}

function sh(){try{localStorage.setItem(HK,JSON.stringify(habits));}catch(e){}}
function sl(){try{localStorage.setItem(LK,JSON.stringify(logs));}catch(e){}}

function tog(id){
  var t=td();
  if(!logs[t])logs[t]={};
  logs[t][id]=!logs[t][id];
  sl();render();
}

function add(){
  var inp=document.getElementById('ni');
  var n=(inp.value||'').trim();
  if(!n)return;
  var em=n.match(/^\p{Emoji}/u);
  var ic=em?em[0]:n[0].toUpperCase();
  habits.push({id:'h'+Date.now(),name:n,ic:ic});
  sh();inp.value='';render();
  document.getElementById('ni').focus();
}

function del(id){
  if(!confirm('¿Borrar este hábito?'))return;
  habits=habits.filter(function(h){return h.id!==id;});
  sh();render();
}

function sv(v){view=v;render();}
function pm(){curMon=new Date(curMon.getFullYear(),curMon.getMonth()-1,1);render();}
function nm(){curMon=new Date(curMon.getFullYear(),curMon.getMonth()+1,1);render();}
function sd(ds){selDay=selDay===ds?null:ds;render();}

function comp(ds){
  var dl=logs[ds]||{},tot=habits.length;
  if(!tot)return null;
  var done=habits.filter(function(h){return dl[h.id];}).length;
  return{done:done,tot:tot,ratio:done/tot};
}

function render(){
  var t=td(),tl=logs[t]||{};
  var cdone=habits.filter(function(h){return tl[h.id];}).length;
  var ctot=habits.length,ratio=ctot?cdone/ctot:0;
  var R=21,circ=2*Math.PI*R,off=circ*(1-ratio);

  var yr=curMon.getFullYear(),mo=curMon.getMonth();
  var fd=new Date(yr,mo,1).getDay(),dim=new Date(yr,mo+1,0).getDate();
  var mname=curMon.toLocaleString('es-ES',{month:'long',year:'numeric'});

  var cal='';
  ['D','L','M','X','J','V','S'].forEach(function(d){cal+='<div class="clbl">'+d+'</div>';});
  for(var i=0;i<fd;i++)cal+='<div></div>';
  for(var d=1;d<=dim;d++){
    var ds=fmt(new Date(yr,mo,d));
    var c=comp(ds),isT=ds===t,isF=ds>t,isSel=ds===selDay;
    var bg='transparent';
    if(!isF&&c&&c.tot>0){
      if(c.ratio===1)bg='#534AB7';
      else if(c.ratio>=0.5)bg='#3C3489';
      else bg='#26215C';
    }
    var brd=isT?'border-color:#AFA9EC;':isSel?'border-color:#CECBF6;':'';
    cal+='<div class="cday'+(isF?'':' tap')+'" style="background:'+bg+';'+brd+(isF?'opacity:.3;':'')+(isF?'':'" onclick="sd(\''+ds+'\')')+'">'
      +'<span class="cnum" style="color:'+(isT?'#AFA9EC':'#CECBF6')+'">'+d+'</span>'
      +(!isF&&c&&c.tot>0?'<span class="csub">'+c.done+'/'+c.tot+'</span>':'')
      +'</div>';
  }

  var det='';
  if(selDay){
    var sl2=logs[selDay]||{};
    var sd2=new Date(selDay+'T12:00:00');
    var slbl=sd2.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
    det='<div class="detail"><p class="dtitle">'+slbl+'</p>'
      +habits.map(function(h){
        var dn=!!sl2[h.id];
        return '<div class="drow"><div class="dchk'+(dn?' on':'')+'">✓</div>'
          +'<div class="dico">'+h.ic+'</div>'
          +'<span class="dname'+(dn?' s':'')+'">'+h.name+'</span></div>';
      }).join('')+'</div>';
  }

  var todayHTML='<div class="hlist">'
    +(habits.length===0?'<p class="empty">Añade tu primer hábito abajo 👇</p>'
      :habits.map(function(h){
        var dn=!!tl[h.id];
        return '<div class="hcard'+(dn?' done':'')+'" onclick="tog(\''+h.id+'\')">'
          +'<div class="chk'+(dn?' on':'')+'">✓</div>'
          +'<div class="hico">'+h.ic+'</div>'
          +'<span class="hname'+(dn?' s':'')+'">'+h.name+'</span>'
          +'<button class="delbtn" onclick="event.stopPropagation();del(\''+h.id+'\')">×</button>'
          +'</div>';
      }).join(''))+'</div>'
    +'<div class="addrow"><input id="ni" class="ainput" placeholder="Nuevo hábito..." onkeydown="if(event.key===\'Enter\')add()"/><button class="abtn" onclick="add()">+</button></div>';

  var calHTML='<div class="mnav">'
    +'<button class="navb" onclick="pm()">‹</button>'
    +'<span class="mname">'+mname+'</span>'
    +'<button class="navb" onclick="nm()">›</button>'
    +'</div>'
    +'<div class="cgrid">'+cal+'</div>'
    +'<div class="leg">'
    +'<div class="legitem"><div class="ldot" style="background:#534AB7"></div><span>Todos</span></div>'
    +'<div class="legitem"><div class="ldot" style="background:#3C3489"></div><span>Parcial</span></div>'
    +'<div class="legitem"><div class="ldot" style="background:#26215C;border:1px solid #2d2572"></div><span>Algunos</span></div>'
    +'</div>'+det;

  document.getElementById('app').innerHTML='<div class="wrap">'
    +'<div class="hdr"><div><p class="htitle">Mis Hábitos</p>'
    +'<p class="hsub">'+new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})+'</p></div>'
    +'<div class="ring-w">'
    +'<svg width="50" height="50" viewBox="0 0 50 50">'
    +'<circle cx="25" cy="25" r="'+R+'" fill="none" stroke="#1a1248" stroke-width="4"/>'
    +'<circle cx="25" cy="25" r="'+R+'" fill="none" stroke="#AFA9EC" stroke-width="4" stroke-dasharray="'+circ.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" stroke-linecap="round" transform="rotate(-90 25 25)"/>'
    +'</svg><span class="ring-txt">'+cdone+'/'+ctot+'</span></div></div>'
    +'<div class="tabs">'
    +'<button class="tab'+(view==='today'?' on':'')+'" onclick="sv(\'today\')">Hoy</button>'
    +'<button class="tab'+(view==='calendar'?' on':'')+'" onclick="sv(\'calendar\')">Calendario</button>'
    +'</div>'
    +(view==='today'?todayHTML:calHTML)
    +'</div>';
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
load();
</script>
</body>
</html>
